# Torchlight Infinite heroes -- populate via the in-app "Manage
# Heroes" editor, or by hand following this shape. 12 base heroes,
# each with 2-3 traits. The roll treats every non-excluded trait
# across every non-excluded hero as one flat pool -- hero grouping is
# just how the data's organized for editing, not a two-step "pick hero
# then pick trait" roll.
#
# Traits carry tags too (e.g. a trait tagged "Attack" scales
# Attack-tagged skills) -- same not-used-for-rolling-yet, stored-for-
# a-future-match status as skill tags.
#
# heroes:
#   - name: "Example Hero"
#     excluded: false
#     traits:
#       - name: "Example Trait"
#         excluded: false
#         tags: ["Attack"]
