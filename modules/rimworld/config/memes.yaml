# RimWorld memes -- populate via the in-app "Manage Memes" editor, or
# by hand following this shape.
#
# axis groups mutually exclusive memes together (e.g. Individualist vs
# Collectivist both under axis: "Structure" -- unrelated to the
# separate ideology-structure roll above, just a coincidentally
# overlapping name from the actual game's own terminology). Rolling is
# axis-fair: an exclusive pair competes as ONE unit against a
# standalone meme, not two units against one -- see roller.py for why
# a naive flat pool would double-weight every exclusive pair. Leave
# axis blank/omit it entirely for a standalone meme with nothing it
# conflicts with.
#
# impact: "low", "medium", or "high" -- matches the real game's own
# three tiers. Only "high" can't be picked as the starting meme (slot
# 1) during fluid ideology creation -- it only ever appears in slot 2
# or 3, gained later through evolution. low/medium impact, or the
# field omitted entirely (defaults to low), are both fine as a
# starting pick.
#
# memes:
#   - name: "Individualist"
#     axis: "Structure"
#     impact: "low"
#     excluded: false
#   - name: "Collectivist"
#     axis: "Structure"
#     impact: "low"
#     excluded: false
#   - name: "Raider"
#     axis: null
#     impact: "medium"
#     excluded: false
