# RimWorld precepts -- populate via the in-app "Manage Precepts"
# editor, or by hand following this shape. Grouped internally by
# `issue` -- every entry sharing the same issue is a candidate for
# that issue's roll.
#
# requirement: every entry must hold against the 3 active memes for
# this precept to even be eligible. "Not X" means meme X must NOT be
# active; anything else must be. An empty list means no gate at all --
# always eligible regardless of memes.
#
# associated: memes that make this precept MORE likely to be chosen
# among whatever's eligible (not a requirement -- just a soft
# preference), same "gate then weight" shape as FO4's weapon/perk
# rolls elsewhere in this project.
#
# required: true on ANY entry for an issue means the whole issue is
# treated as required -- always resolves to something if it has any
# gate-survivors, same as every issue behaved before this existed.
# Omitted/false (the default) means the issue is optional: it only has
# a 50% base chance of being addressed by a given ideology at all,
# rather than always forcing a pick. Fixes "every colony feels the
# same" -- forcing binary/no-real-positive-option issues to always
# resolve was drowning out the few issues that actually reflect memes.
#
# extreme: true on a SPECIFIC option (not the whole issue) marks it as
# one of the far ends of that issue's spectrum (e.g. "Research Not
# Allowed" or "Very Fast" on a research-speed issue). Extreme options
# participate in a running, WHOLE-IDEOLOGY tally -- each one actually
# chosen makes every subsequent extreme option (on a different issue)
# progressively less likely, discouraging an ideology that's extreme
# on every single axis, not just each issue independently.
#
# precepts:
#   - issue: "Blindness"
#     precept: "Horrible"
#     requirement: ["Not Blindsight"]
#     associated: []
#     required: true
#     extreme: false
#     excluded: false
#   - issue: "Blindness"
#     precept: "Respected"
#     requirement: ["Blindsight"]
#     associated: ["Blindsight"]
#     required: true
#     extreme: false
#     excluded: false
