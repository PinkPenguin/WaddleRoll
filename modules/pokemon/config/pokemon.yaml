# Pokemon roster -- populate via the in-app "Manage Pokémon" grid
# editor, or by hand following this shape. Paste your list into the
# chat and it can be converted directly into this instead of you
# hand-filling it.
#
# next_evolution is how "fully evolved" is derived -- null/omitted
# means nothing further to evolve into, so it's eligible to roll.
# Anything with a next_evolution is filtered out automatically, no
# separate flag needed. previous_evolution is deliberately not
# modeled -- nothing here needs it.
#
# dex_id is purely for sorting/display in the grid editor -- it's
# never used as a lookup key (name is), so alternate forms sharing a
# dex number with their base species is fine, not a conflict.
#
# types: not used for anything yet (no filtering, no logic reads this
# today) -- stored for a future team type-effectiveness display. Use
# current/latest typing per Bulbapedia for now. Typing has genuinely
# changed across generations historically (Fairy type didn't exist
# before Gen 6 and retroactively applied to some existing Pokemon,
# Steel didn't exist before Gen 2, etc.) -- if that ever actually
# matters here, it'll likely mean splitting this into a per-generation
# config down the line, not something to solve preemptively now.
#
