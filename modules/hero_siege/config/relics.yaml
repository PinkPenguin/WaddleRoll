# 142 relics parsed from your season 9 list.
#
# tags are derived from each relic's listed damage type (Arcane/Fire/
# Cold->frost/Poison/Lightning/Physical Damage). Relics with no elemental
# line (pure stat sticks -- life, movement speed, attributes, gold find,
# etc.) are tagged "universal" AND set excluded: true by default, since
# they're not build-defining. The universal-matching logic still lives in
# roller.py in case you ever want to un-exclude one later or add a new
# elementless relic that should stay in the pool.
#
# One name collision fixed: two different relics were both named "Bomb"
# in the source list -- renamed to "Bomb (Explosion Damage)" and
# "Bomb (Naval)" to keep them distinguishable in the editor.
#
# A handful of "proc" relics cast an actual class skill (e.g. Skull Axe
# casts Demon Slayer's "Demon Form"). Only tagged by damage element, not
# by which class the referenced skill belongs to -- worth a look if you
# want those to lean toward their source class specifically.
#
